name: Market Learning Agent

on:
  schedule:
    - cron: '*/30 * * * *'   # כל 30 דקות
  workflow_dispatch:        # אפשרות להרצה ידנית
  push:                     # ריצה אוטומטית כשהקוד משתנה
    branches: [master]
    paths:
      - 'learn_agent.py'
      - 'news_dashboard.py'
      - 'learn_config.json'
      - '.github/workflows/hourly_dashboard.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run learning agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WEBSHARE_PROXY_USERNAME: ${{ secrets.WEBSHARE_PROXY_USERNAME }}
          WEBSHARE_PROXY_PASSWORD: ${{ secrets.WEBSHARE_PROXY_PASSWORD }}
          YT_PROXY_URL: ${{ secrets.YT_PROXY_URL }}
        run: python learn_agent.py

      - name: Push to GitHub Pages
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add docs/index.html docs/learn.json
          git diff --staged --quiet || git commit -m "Learning agent update $(date +'%Y-%m-%d %H:%M UTC')"
          git push
