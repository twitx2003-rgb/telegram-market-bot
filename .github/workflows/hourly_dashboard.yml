name: Hourly News Dashboard

on:
  schedule:
    - cron: '0 * * * *'   # כל שעה עגולה (UTC) = כל שעה
  workflow_dispatch:        # אפשרות להרצה ידנית

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate news dashboard
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python news_dashboard.py

      - name: Push to GitHub Pages
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add docs/index.html
          git diff --staged --quiet || git commit -m "Dashboard update $(date +'%Y-%m-%d %H:%M UTC')"
          git push
