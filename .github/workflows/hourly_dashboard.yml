name: Hourly News Dashboard

on:
  schedule:
    - cron: '*/30 * * * *'   # כל 30 דקות
  workflow_dispatch:        # אפשרות להרצה ידנית
  push:                     # ריצה אוטומטית כשהקוד משתנה
    branches: [master]
    paths:
      - 'news_dashboard.py'
      - 'watchlist.json'
      - '.github/workflows/hourly_dashboard.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate news dashboard
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python news_dashboard.py

      - name: Push to GitHub Pages
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add docs/index.html docs/data.json docs/track_record.json
          git diff --staged --quiet || git commit -m "Dashboard update $(date +'%Y-%m-%d %H:%M UTC')"
          git push
