name: Market Alerts

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'alert or summary'
        default: 'alert'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Restore seen news cache
        uses: actions/cache@v4
        with:
          path: seen_news.json
          key: seen-news-${{ github.run_id }}
          restore-keys: seen-news-

      - name: Run bot
        env:
          EMAIL_FROM:     ${{ secrets.EMAIL_FROM }}
          EMAIL_TO:       ${{ secrets.EMAIL_TO }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: python market_news.py ${{ github.event.inputs.mode || 'alert' }}

      - name: Save seen news cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: seen_news.json
          key: seen-news-${{ github.run_id }}
