name: Daily AI Dashboard Improvement

on:
  schedule:
    - cron: '30 9 * * *'   # 12:30 שעון ישראל קיץ (IDT = UTC+3) / 11:30 חורף (IST = UTC+2)
    #                        רץ 30 דקות אחרי הסיכום היומי (09:00 UTC)
  workflow_dispatch:         # הרצה ידנית מה-Actions tab

permissions:
  contents: write

jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Pull the latest docs/index.html (generated by hourly dashboard)
          ref: master

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run AI Improvement Agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python improvement_agent.py

      - name: Commit & push updated dashboard
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "AI Improvement Agent"
          git add docs/index.html docs/brief.json
          git diff --staged --quiet || \
            git commit -m "AI improvement: $(date +'%Y-%m-%d %H:%M' --utc) UTC"
          git push
