name: Daily AI Dashboard Improvement

on:
  schedule:
    - cron: '30 12 * * *'   # כל יום בשעה 12:30 UTC (לאחר ריצת הדשבורד)
  workflow_dispatch:         # הרצה ידנית מה-Actions tab

permissions:
  contents: write

jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Pull the latest docs/index.html (generated by hourly dashboard)
          ref: master

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run AI Improvement Agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python improvement_agent.py

      - name: Commit & push updated dashboard
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "AI Improvement Agent"
          git add docs/index.html
          git diff --staged --quiet || \
            git commit -m "AI improvement: $(date +'%Y-%m-%d') — daily enhancement"
          git push
